name: IaC Security Scans

on:
  pull_request:
  push:

jobs:
  security_scans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform

      - name: Setup Ruby (for cfn-nag)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install cfn-nag
        run: gem install cfn-nag

      - name: Run cfn-nag (CloudFormation)
        run: |
          if ls **/*.yml **/*.yaml **/*.json 1> /dev/null 2>&1; then
            cfn_nag_scan --input-path .
          else
            echo "No CloudFormation templates found. Skipping cfn-nag."
          fi
